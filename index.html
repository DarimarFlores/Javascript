<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Lista de Tarefas</h1>

    <div id="adicionarTarefa">
        <input type="text" id="novaTarefa" placeholder="Adicionar nova tarefa">
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <div id="filtrarTarefasDiv">
        <label for="filtrarTarefas">Filtrar:</label>
        <select id="filtrarTarefas" onchange="filtrarTarefas()">
            <option value="todas">Todas</option>
            <option value="concluidas">Concluídas</option>
            <option value="pendentes">Pendentes</option>
        </select>
    </div>

    <ul id="listaDeTarefas">
    </ul>

    <div id="acoesGerais">
        <button onclick="limparTudo()">Limpar Tudo</button>
    </div>

    <script src="js/script.js">
        
    </script>
</body>
</html>
